# yaml-language-server: $schema=https://raw.githubusercontent.com/rendercv/rendercv/refs/tags/v2.8/schema.json
design:
  theme: engineeringclassic
  page:
    size: a4
    top_margin: 0.75cm
    bottom_margin: 0.75cm
    left_margin: 1.2cm
    right_margin: 1.2cm
    show_footer: false
    show_top_note: false
  typography:
    line_spacing: 0.55em
    alignment: justified-with-no-hyphenation
    date_and_location_column_alignment: right
    font_size:
      body: 9.5pt
      name: 24pt
      headline: 10pt
      connections: 9.5pt
      section_titles: 1.25em
  header:
    alignment: left
    space_below_name: 0.35cm
    space_below_headline: 0.35cm
    space_below_connections: 0.35cm
    connections:
      phone_number_format: international
      hyperlink: true
      show_icons: true
      display_urls_instead_of_usernames: false
      separator: ''
      space_between_connections: 0.5cm
  section_titles:
    type: with_full_line
    line_thickness: 0.5pt
    space_above: 0.22cm
    space_below: 0.12cm
  sections:
    allow_page_break: true
    space_between_regular_entries: 0.22cm
    space_between_text_based_entries: 0.12cm
    show_time_spans_in: []
  entries:
    date_and_location_width: 5.4cm
    side_space: 0cm
    space_between_columns: 0.2cm
    allow_page_break: false
    short_second_row: false
    summary:
      space_above: 0.06cm
      space_left: 0cm
    highlights:
      bullet: •
      nested_bullet: ◦
      space_left: 0.15cm
      space_above: 0.06cm
      space_between_items: 0.06cm
      space_between_bullet_and_text: 0.4em
  templates:
    education_entry:
      main_column: |-
        **INSTITUTION** — DEGREE in AREA
        SUMMARY
        HIGHLIGHTS
      degree_column: null
      date_and_location_column: LOCATION · DATE
    normal_entry:
      main_column: |-
        **NAME**
        SUMMARY
        HIGHLIGHTS
      date_and_location_column: LOCATION · DATE
    experience_entry:
      main_column: |-
        **COMPANY**, POSITION
        SUMMARY
        HIGHLIGHTS
      date_and_location_column: LOCATION · DATE
