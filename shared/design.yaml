# yaml-language-server: $schema=https://raw.githubusercontent.com/rendercv/rendercv/refs/tags/v2.8/schema.json
design:
  theme: classic
  page:
    size: a4
    top_margin: 0.9cm
    bottom_margin: 0.9cm
    left_margin: 1.3cm
    right_margin: 1.3cm
    show_footer: false
    show_top_note: false
  # colors:
  #   body: rgb(0, 0, 0)
  #   name: rgb(0, 79, 144)
  #   headline: rgb(0, 79, 144)
  #   connections: rgb(0, 79, 144)
  #   section_titles: rgb(0, 79, 144)
  #   links: rgb(0, 79, 144)
  #   footer: rgb(128, 128, 128)
  #   top_note: rgb(128, 128, 128)
  typography:
    line_spacing: 0.55em
    alignment: justified-with-no-hyphenation
    date_and_location_column_alignment: right
    font_size:
      body: 9.5pt
      name: 24pt
      headline: 10pt
      connections: 9.5pt
      section_titles: 1.25em
  # links:
  #   underline: false
  #   show_external_link_icon: false
  header:
    alignment: center
    space_below_name: 0.35cm
    space_below_headline: 0.35cm
    space_below_connections: 0.35cm
    connections:
      phone_number_format: international
      hyperlink: true
      show_icons: true
      display_urls_instead_of_usernames: false
      separator: ''
      space_between_connections: 0.5cm
  section_titles:
    type: with_partial_line
    line_thickness: 0.5pt
    space_above: 0.28cm
    space_below: 0.15cm
  sections:
    allow_page_break: true
    space_between_regular_entries: 0.55em
    space_between_text_based_entries: 0.2em
    show_time_spans_in: []
  entries:
    date_and_location_width: 5.5cm
    side_space: 0.15cm
    space_between_columns: 0.2cm
    allow_page_break: false
    short_second_row: false
    summary:
      space_above: 0.06cm
      space_left: 0cm
    highlights:
      bullet: •
      nested_bullet: •
      space_left: 0.15cm
      space_above: 0.06cm
      space_between_items: 0.06cm
      space_between_bullet_and_text: 0.45em
  templates:
    education_entry:
      main_column: |-
        **INSTITUTION** — DEGREE_WITH_AREA
        SUMMARY
        HIGHLIGHTS
      degree_column: null
      date_and_location_column: LOCATION · DATE
    normal_entry:
      main_column: |-
        **NAME**
        SUMMARY
        HIGHLIGHTS
      date_and_location_column: LOCATION · DATE
    experience_entry:
      main_column: |-
        **COMPANY**, POSITION
        SUMMARY
        HIGHLIGHTS
      date_and_location_column: LOCATION · DATE
